# Builds the Windows installer, DicomDoodle-<version>-Setup.exe, on a Windows
# machine of GitHub's and attaches it to the release of the version tag.
#
# Start it by pushing a version tag:   git tag v2.0.0 && git push origin v2.0.0
# or by hand: Actions tab > "Windows installer" > Run workflow (the installer is
# then kept for 7 days on the run's page instead of being released).
#
# The three AI model files come from the release "models-v1"
# (uploaded once with DicomDoodle_App/packaging/upload_models.py).
name: Windows installer

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write                  # create the release and attach the installer

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7

      - name: Check the tag matches APP_VERSION
        if: github.ref_type == 'tag'
        run: |
          $source = Get-Content DicomDoodle_App/dicomdoodle/__init__.py -Raw
          $app = [regex]::Match($source, 'APP_VERSION = "([^"]+)"').Groups[1].Value
          $tag = $env:GITHUB_REF_NAME.TrimStart("v")
          if ($app -ne $tag) { throw "Tag $env:GITHUB_REF_NAME does not match APP_VERSION $app in dicomdoodle/__init__.py" }

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: DicomDoodle_App/packaging/*-windows.txt

      - name: Install the Python packages
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          python -m pip install --upgrade pip
          python -m pip install torch==2.11.0 torchvision==0.26.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r DicomDoodle_App/packaging/requirements-windows.txt -c DicomDoodle_App/packaging/constraints-windows.txt

      - name: Download the AI model files
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download models-v1 --repo "${{ github.repository }}" --pattern "*.pt" --dir models

      - name: Build DicomDoodle.exe (PyInstaller)
        env:
          DICOMDOODLE_MODELS: ${{ github.workspace }}\models
        run: python -m PyInstaller --noconfirm --distpath build/dist --workpath build/work DicomDoodle_App/packaging/DicomDoodle.spec

      - name: Self-test of DicomDoodle.exe
        run: |
          $report = Join-Path $PWD "selftest.txt"
          $p = Start-Process -FilePath build\dist\DicomDoodle\DicomDoodle.exe -ArgumentList "--self-test", "`"$report`"" -PassThru
          $null = $p.Handle                        # keeps the exit code readable
          if (-not $p.WaitForExit(900000)) { $p.Kill(); throw "The self-test did not finish within 15 minutes" }
          if (Test-Path $report) { Get-Content $report }
          if ($p.ExitCode -ne 0) { throw "The self-test failed (exit code $($p.ExitCode))" }

      - name: Build the installer (Inno Setup)
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $find = { Get-ChildItem "${env:ProgramFiles(x86)}\Inno Setup*\ISCC.exe", "$env:ProgramFiles\Inno Setup*\ISCC.exe" -ErrorAction SilentlyContinue | Select-Object -First 1 }
          $iscc = & $find
          if (-not $iscc) { choco install innosetup -y --no-progress; $iscc = & $find }
          $version = if ($env:GITHUB_REF_TYPE -eq "tag") { $env:GITHUB_REF_NAME.TrimStart("v") } else { "dev" }
          & $iscc.FullName "/DAppVersion=$version" DicomDoodle_App\packaging\DicomDoodle.iss
          Get-ChildItem build\installer | Format-Table Name, @{ Name = "MB"; Expression = { [math]::Round($_.Length / 1MB) } }

      - name: Attach the installer to the release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v3
        with:
          files: build/installer/*.exe
          generate_release_notes: true
          body: |
            **Windows:** download the `DicomDoodle-…-Setup.exe` file below (under *Assets*) and run it. No administrator rights are needed; the AI models are included.
            Windows may say *"Windows protected your PC"* because the installer is not signed: click **More info ▸ Run anyway**.
            Skull stripping (HD-BET) downloads its network the first time it runs, so that first run needs an internet connection.

      - name: Keep the installer on the run's page (manual runs)
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v7
        with:
          name: DicomDoodle-installer
          path: build/installer/*.exe
          retention-days: 7
          compression-level: 0
